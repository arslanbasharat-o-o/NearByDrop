name: Build

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Diagnostics backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PHP test tools
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 sqlite3
      - name: Check receiver and safeguards
        run: |
          for file in diagnostics/hostinger/public/*.php; do php -l "$file"; done
          bash diagnostics/hostinger/tests/local-smoke.sh

  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 Intel can hang in ibtool: actions/runner-images#14751.
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project NearByDrop.xcodeproj -scheme NearByDrop \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO test | tee tests.log
      - name: Check diagnostics client
        run: bash scripts/tests/diagnostics-client.sh
      - name: Test installer safety and rollback
        run: bash scripts/tests/install.sh
      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild -project NearByDrop.xcodeproj -scheme NearByDrop \
            -configuration Debug -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO analyze | tee analyze.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.runner }}
          path: |
            *.log
            build-tests/Logs/Test/*.xcresult
          retention-days: 7

  workflow-policy:
    name: Workflow security policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release isolation and package modes
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint .github/workflows/*.yml
          python3 scripts/check_workflow_security.py
          bash -n scripts/package-release.sh
          bash -n scripts/tests/package-release-modes.sh
          bash scripts/tests/package-release-modes.sh

  package:
    name: Universal app
    needs: [test, diagnostics, workflow-policy]
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build universal release
        run: |
          set -o pipefail
          xcodebuild -project NearByDrop.xcodeproj -scheme NearByDrop \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build | tee build.log
      - name: Verify and package
        run: scripts/package-release.sh build dist --ci-unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nearby-drop-ci-nonpublic
          if-no-files-found: error
          path: |
            dist/*-ci-unsigned.dmg
            dist/*-ci-unsigned-universal.zip
            dist/SHA256SUMS.txt
            dist/NONPUBLIC-CI-ARTIFACTS.txt
          retention-days: 7

