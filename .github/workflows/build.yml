name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 Intel can hang in ibtool: actions/runner-images#14751.
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project NearByDrop.xcodeproj -scheme NearByDrop \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO test | tee tests.log
      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild -project NearByDrop.xcodeproj -scheme NearByDrop \
            -configuration Debug -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO analyze | tee analyze.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.runner }}
          path: |
            *.log
            build-tests/Logs/Test/*.xcresult
          retention-days: 7

  package:
    name: Universal app
    needs: test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build universal release
        run: |
          set -o pipefail
          xcodebuild -project NearByDrop.xcodeproj -scheme NearByDrop \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build | tee build.log
      - name: Verify and package
        run: scripts/package-release.sh build dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nearby-Drop-universal
          path: dist/*
          retention-days: 14
